        window.__FILE_MAP__ = {"index.html":"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>BuildMind Container Test</title>\n  </head>\n  <body>\n    <div id=\"root\"></div>\n    <script type=\"module\" src=\"/src/main.jsx\"><\/script>\n  </body>\n</html>","package.json":"{\n  \"name\": \"buildmind-container-test\",\n  \"private\": true,\n  \"version\": \"1.0.0\",\n  \"type\": \"module\",\n  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"vite build\",\n    \"preview\": \"vite preview\"\n  },\n  \"dependencies\": {\n    \"react\": \"^18.3.1\",\n    \"react-dom\": \"^18.3.1\"\n  },\n  \"devDependencies\": {\n    \"@vitejs/plugin-react\": \"^4.3.4\",\n    \"vite\": \"^6.0.5\"\n  }\n}","src/main.jsx":"import React, { useMemo, useState } from \"react\";\nimport { createRoot } from \"react-dom/client\";\nimport \"./style.css\";\n\nconst initialTasks = [\n  { id: 1, title: \"اختبار Container Build\", status: \"done\" },\n  { id: 2, title: \"تشغيل npm install\", status: \"doing\" },\n  { id: 3, title: \"اختبار النشر الحقيقي\", status: \"todo\" }\n];\n\nfunction App() {\n  const [tasks, setTasks] = useState(initialTasks);\n  const [text, setText] = useState(\"\");\n  const [filter, setFilter] = useState(\"all\");\n\n  const visible = useMemo(\n    () => filter === \"all\" ? tasks : tasks.filter(t => t.status === filter),\n    [tasks, filter]\n  );\n\n  function addTask(e) {\n    e.preventDefault();\n    const title = text.trim();\n    if (!title) return;\n    setTasks([{ id: Date.now(), title, status: \"todo\" }, ...tasks]);\n    setText(\"\");\n  }\n\n  function cycleStatus(id) {\n    setTasks(tasks.map(t => t.id !== id ? t : ({\n      ...t,\n      status: t.status === \"todo\" ? \"doing\" : t.status === \"doing\" ? \"done\" : \"todo\"\n    })));\n  }\n\n  function removeTask(id) {\n    setTasks(tasks.filter(t => t.id !== id));\n  }\n\n  const counts = {\n    all: tasks.length,\n    todo: tasks.filter(t => t.status === \"todo\").length,\n    doing: tasks.filter(t => t.status === \"doing\").length,\n    done: tasks.filter(t => t.status === \"done\").length\n  };\n\n  return (\n    <main className=\"page\">\n      <section className=\"app\">\n        <header>\n          <div>\n            <span className=\"badge\">CONTAINER BUILD TEST</span>\n            <h1>لوحة مهام BuildMind</h1>\n            <p>مشروع React/Vite حقيقي لاختبار البناء على الخادم.</p>\n          </div>\n          <div className=\"status\">● جاهز للاختبار</div>\n        </header>\n\n        <div className=\"stats\">\n          <div><b>{counts.all}</b><span>كل المهام</span></div>\n          <div><b>{counts.todo}</b><span>معلقة</span></div>\n          <div><b>{counts.doing}</b><span>قيد التنفيذ</span></div>\n          <div><b>{counts.done}</b><span>مكتملة</span></div>\n        </div>\n\n        <form onSubmit={addTask} className=\"add\">\n          <input value={text} onChange={e => setText(e.target.value)}\n                 placeholder=\"اكتب مهمة جديدة...\" />\n          <button>إضافة مهمة</button>\n        </form>\n\n        <nav className=\"filters\">\n          {[\n            [\"all\",\"الكل\"],[\"todo\",\"معلقة\"],[\"doing\",\"قيد التنفيذ\"],[\"done\",\"مكتملة\"]\n          ].map(([key,label]) =>\n            <button key={key} className={filter===key ? \"active\":\"\"}\n              onClick={() => setFilter(key)}>{label}</button>\n          )}\n        </nav>\n\n        <section className=\"tasks\">\n          {visible.map(task =>\n            <article className=\"task\" key={task.id}>\n              <div>\n                <strong>{task.title}</strong>\n                <small>{task.status === \"done\" ? \"مكتملة\" : task.status === \"doing\" ? \"قيد التنفيذ\" : \"معلقة\"}</small>\n              </div>\n              <div className=\"actions\">\n                <button onClick={() => cycleStatus(task.id)}>تغيير الحالة</button>\n                <button className=\"danger\" onClick={() => removeTask(task.id)}>حذف</button>\n              </div>\n            </article>\n          )}\n          {!visible.length && <div className=\"empty\">لا توجد مهام في هذا القسم.</div>}\n        </section>\n\n        <footer>\n          <span>BuildMind</span>\n          <span>React + Vite</span>\n          <span>npm install → npm run build</span>\n        </footer>\n      </section>\n    </main>\n  );\n}\n\ncreateRoot(document.getElementById(\"root\")).render(<App />);","vite.config.js":"import { defineConfig } from \"vite\";\nimport react from \"@vitejs/plugin-react\";\n\nexport default defineConfig({\n  plugins: [react()]\n});","src/style.css":"*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#18202a}.page{min-height:100vh;padding:40px 18px}.app{max-width:1000px;margin:auto;background:white;border:1px solid #e5e8ee;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(20,30,50,.08)}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}h1{margin:10px 0 6px;font-size:32px}p{margin:0;color:#687384}.badge{font-size:11px;font-weight:800;letter-spacing:1px;background:#eef2ff;padding:7px 10px;border-radius:999px}.status{background:#eaf8ef;color:#18753c;padding:10px 14px;border-radius:12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.stats div{padding:18px;border:1px solid #e8ebf0;border-radius:16px}.stats b,.stats span{display:block}.stats b{font-size:28px}.stats span{color:#697586;margin-top:4px}.add{display:flex;gap:10px}.add input{flex:1;border:1px solid #d9dee7;border-radius:12px;padding:14px;font-size:16px}.add button,.actions button,.filters button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.add button{background:#18202a;color:white}.filters{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.filters button{background:#f0f2f5}.filters .active{background:#182
